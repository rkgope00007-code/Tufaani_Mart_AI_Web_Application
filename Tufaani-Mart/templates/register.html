{% extends "base.html" %}
{% block content %}
<section class="auth-wrap"><div class="auth-card"><h2>Create your account</h2><p class="text-muted">Admin accounts are permanent and cannot be registered here.</p>
<form method="post">
<div class="role-grid mb-3"><label><input type="radio" name="role" value="customer" checked onchange="document.getElementById('store').style.display='none'"><span>🛒 Customer</span></label><label><input type="radio" name="role" value="seller" onchange="document.getElementById('store').style.display='block'"><span>🏪 Seller</span></label></div>
<input class="form-control mb-3" name="full_name" placeholder="Full name" required><input class="form-control mb-3" type="email" name="email" placeholder="Email" required><input class="form-control mb-3" name="phone" placeholder="Phone">
<div id="store" style="display:none"><input class="form-control mb-3" name="store_name" placeholder="Store name"></div>
<label>Password</label>
<div class="password-wrap mb-3"><input class="form-control" type="password" name="password" id="registerPassword" placeholder="Password" required><button type="button" class="password-toggle" onclick="togglePassword('registerPassword', this)" aria-label="Show password"><i class="fa-regular fa-eye"></i><span>Show</span></button></div>
<label>Confirm Password</label>
<div class="password-wrap mb-4"><input class="form-control" type="password" name="confirm_password" id="confirmPassword" placeholder="Confirm password" required><button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" aria-label="Show password"><i class="fa-regular fa-eye"></i><span>Show</span></button></div>
<button class="btn btn-primary w-100 py-3">Create account</button></form></div></section>
{% endblock %}
