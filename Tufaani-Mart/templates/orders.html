{% extends "base.html" %}{% block content %}<section class="container py-5"><h2>My Orders</h2>{% for o in orders %}<div class="summary mb-3"><div class="d-flex justify-content-between"><h5>Order #{{ o.id }}</h5><span class="status">{{ o.status }}</span></div><p class="text-muted">₹{{ '%.2f'|format(o.total_amount) }} · {{ o.payment_method }}</p><p>{{ o.delivery_address }}</p><a href="{{ url_for('order_details', order_id=o.id) }}">View details →</a></div>{% else %}<p>No orders yet.</p>{% endfor %}</section>{% endblock %}
