{% extends "base.html" %}{% block content %}<section class="container py-5"><h2>Wishlist</h2>{% for p in products %}<div class="summary mb-2">{{ p.product_name }} — ₹{{ '%.2f'|format(p.price) }}<form class="d-inline" method="post" action="{{ url_for('remove_from_wishlist', product_id=p.id) }}"><button class="btn btn-sm btn-outline-danger">Remove</button></form></div>{% else %}<p>Your wishlist is empty.</p>{% endfor %}</section>{% endblock %}
