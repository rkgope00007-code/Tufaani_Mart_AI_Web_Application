{% extends "base.html" %}{% block content %}<section class="container py-5"><div class="summary"><h2>Order #{{ order.id }}</h2><span class="status">{{ order.status }}</span><hr><p><b>Delivery:</b> {{ order.delivery_address }}</p><p><b>Phone:</b> {{ order.phone }}</p><p><b>Payment:</b> {{ order.payment_method }}</p><h4>Total: ₹{{ '%.2f'|format(order.total_amount) }}</h4><a href="{{ url_for('orders') }}">← Back to orders</a></div></section>{% endblock %}
