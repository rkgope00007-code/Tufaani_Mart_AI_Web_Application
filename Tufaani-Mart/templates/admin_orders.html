{% extends "base.html" %}{% block content %}<section class="container py-5"><h2>All Orders</h2>{% for o in orders %}<div class="summary mb-3"><div class="d-flex justify-content-between"><h5>Order #{{ o.id }}</h5><span class="status">{{ o.status }}</span></div><p>Customer #{{ o.user_id }} · ₹{{ '%.2f'|format(o.total_amount) }}</p><form method="post" action="{{ url_for('admin_order_status', order_id=o.id) }}" class="d-flex gap-2"><select name="status" class="form-select">{% for s in ['Pending','Accepted','Preparing','Out for Delivery','Delivered','Cancelled'] %}<option {% if o.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><button class="btn btn-primary">Update</button></form></div>{% endfor %}</section>{% endblock %}
