{% extends "base.html" %}{% block content %}<section class="container py-5"><div class="form-card"><h2>Add Product</h2><form method="post" enctype="multipart/form-data"><input class="form-control mb-3" name="product_name" placeholder="Product name" required><textarea class="form-control mb-3" name="description" placeholder="Description"></textarea><div class="row"><div class="col-md-6"><input class="form-control mb-3" name="price" type="number" step="0.01" placeholder="Price" required></div><div class="col-md-6"><input class="form-control mb-3" name="stock" type="number" placeholder="Stock" required></div></div><input class="form-control mb-3" name="category" placeholder="Category" required><input class="form-control mb-3" name="brand" placeholder="Brand"><input class="form-control mb-3" name="unit" value="1 piece" placeholder="Unit"><input class="form-control mb-3" name="discount" type="number" step="0.1" value="0" placeholder="Discount %"><label class="fw-bold mb-2" for="image">Product Photo</label><input id="image" class="form-control mb-2" type="file" name="image" accept="image/png,image/jpeg,image/webp" required><div class="form-text mb-4">PNG, JPG, JPEG or WEBP • Max 5 MB</div><button class="btn btn-primary w-100 py-3">Add Product</button></form></div></section>{% endblock %}
