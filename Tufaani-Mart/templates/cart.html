{% extends "base.html" %}{% block content %}<section class="container py-5"><h2>Your Cart</h2><div class="row g-4 mt-1"><div class="col-lg-8">{% for x in items %}<div class="card border-0 shadow-sm mb-3"><div class="card-body d-flex justify-content-between align-items-center"><div><h5>{{ x.product.product_name }}</h5><span>₹{{ '%.2f'|format(x.item_total) }}</span></div><form method="post" action="{{ url_for('update_cart', cart_id=x.item.id) }}" class="d-flex gap-2"><input class="form-control" style="width:90px" type="number" name="quantity" min="1" value="{{ x.item.quantity }}"><button class="btn btn-outline-primary">Update</button></form><form method="post" action="{{ url_for('remove_from_cart', cart_id=x.item.id) }}"><button class="btn btn-outline-danger">Remove</button></form></div></div>{% else %}<p>Your cart is empty.</p>{% endfor %}</div><div class="col-lg-4"><div class="summary"><h4>Summary</h4><div class="d-flex justify-content-between"><span>Total</span><b>₹{{ '%.2f'|format(total) }}</b></div><a href="{{ url_for('checkout') }}" class="btn btn-primary w-100 mt-4">Checkout</a></div></div></div></section>{% endblock %}
