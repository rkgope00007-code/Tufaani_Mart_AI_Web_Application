{% extends "base.html" %}{% block content %}<section class="container py-5"><div class="row g-4"><div class="col-lg-7"><div class="summary"><h3>Checkout</h3>{% for x in cart_products %}<div class="d-flex justify-content-between py-3 border-bottom"><span>{{ x.product.product_name }} × {{ x.item.quantity }}</span><b>₹{{ '%.2f'|format(x.item_total) }}</b></div>{% endfor %}<h4 class="text-end mt-4">₹{{ '%.2f'|format(total_amount) }}</h4></div></div><div class="col-lg-5"><div class="summary"><h4>Delivery & Payment</h4><form method="post" action="{{ url_for('checkout') }}"><label class="fw-bold">Delivery Address</label><textarea name="delivery_address" class="form-control mb-3" rows="4" placeholder="Flat/House No., Building, Street, Area, City, State, PIN Code" required></textarea><label class="fw-bold">Phone</label><input name="phone" class="form-control mb-3" required><label class="fw-bold">Payment</label><select name="payment_method" class="form-select mb-4"><option value="cod">Cash on Delivery</option><option value="online">Online Payment</option></select><button class="btn btn-primary w-100 py-3">Place Order</button></form></div></div></div></section>{% endblock %}
