{% extends "base.html" %}{% block content %}<section class="container py-5"><div class="d-flex justify-content-between"><h2>My Products</h2><a class="btn btn-primary" href="{{ url_for('add_product') }}">+ Add Product</a></div><div class="row g-3 mt-2">{% for p in products %}<div class="col-md-4"><div class="summary"><h5>{{ p.product_name }}</h5><p>₹{{ '%.2f'|format(p.price) }} · Stock {{ p.stock }}</p><form method="post" action="{{ url_for('delete_product', product_id=p.id) }}"><button class="btn btn-outline-danger btn-sm">Delete</button></form></div></div>{% else %}<p>No products.</p>{% endfor %}</div></section>{% endblock %}
